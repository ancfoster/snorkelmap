<span class="checkbox">
  <input type="checkbox" class="checkbox__input" name="{{ widget.name }}"
    {% if widget.value != None %}value="{{ widget.value|stringformat:'s' }}"{% endif %}
    {% include "django/forms/widgets/attrs.html" %}>
  <span class="checkbox__indicator">
    <svg class="checkbox__check" viewBox="0 0 12 10" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
      <path d="M4 9.4L0 5.4L1.4 4L4 6.6L10.6 0L12 1.4L4 9.4Z" fill="currentColor"/>
    </svg>
  </span>
</span>
